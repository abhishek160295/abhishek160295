const R=rng(21);

// ---------------- timeline ----------------
function swipeIdx(t){return Math.floor(t<2?t/.45:4.44+(t-2)/.28)}
function clockAt(t){let m;
 if(t<2)m=1382+Math.floor(seg(t,.3,2)*3);else if(t<5.2){const q=seg(t,2,5.2);m=1385+Math.floor(249*q*q)}else if(t<6)m=1634;else if(t<6.6)m=390;else if(t<7.2)m=399;else m=432;
 m%=1440;const h=Math.floor(m/60),mm=m%60;return{s:`${h%12||12}:${String(mm).padStart(2,'0')}`,ap:h<12?'AM':'PM',red:t>=7.2}}
function state(t){
 const cta=t>13.7;
 const amb=cta?.92:lerp(0,.78,eio(seg(t,5.85,6.7)));
 const dust=cta?eio(seg(t,2.3,5.2))*(1-0):eio(seg(t,2.3,5.2)),gdust=cta?dust*(1-eio(seg(t,14.3,15.3))):dust;

 const slap=Math.max(bump(seg(t,6.2,6.55)),bump(seg(t,6.8,7.15)));

 let glowI=scrolling?1-.25*fatigue:0;if(buzz)glowI=.75;if(t>7.2&&t<8.4)glowI=.35;
 return{t,cta,amb,dust,gdust,hue:buzz||t>7.2?'255,255,255'.replace(/255,255,255/,'210,225,255'):hue,fr,scrolling,drop,handsDown,buzz,slap,flail,fatigue,glowI,moon:seg(t,0,5.2)}}

// ---------------- room ----------------
function elbow(s,h,dir,L=80){const dx=h[0]-s[0],dy=h[1]-s[1],d=Math.max(1,Math.hypot(dx,dy)),dd=Math.min(d,2*L-.1),a=Math.sqrt(Math.max(0,L*L-(dd/2)**2));return[s[0]+dx/2-dy/d*a*dir,s[1]+dy/2+dx/d*a*dir]}
function line(c,p,w){c.lineWidth=w;c.beginPath();c.moveTo(...p[0]);for(let i=1;i<p.length;i++)c.lineTo(...p[i]);c.stroke()}
function phonePose(s){const t=s.t;
 const jit=s.scrolling?bump(s.fr/.35)*10:0,hand=[452,lerp(1128,1170,s.fatigue)-jit*.4];

 let p=L2(inHand,face,s.drop),r=lerp(-.35,-1.5,s.drop);
 if(t>5.42&&t<5.6)p=[p[0],p[1]-bump(seg(t,5.42,5.56))*10];

 if(t>7.2){const q=eio(seg(t,7.2,7.5));p=L2(face,[300,1262],q);r=lerp(-1.5,-1.57,q)}
 return{p,r,hand,jit}}

 for(let i=0;i<7;i++){OX.beginPath();OX.moveTo(W,1060+i*12);OX.quadraticCurveTo(1010,1090+i*6,hx-36+i*8,hy+40+i*4);OX.stroke()}

 c.fillStyle='#161a26';c.fillRect(746,628,8,344);c.fillRect(588,796,324,8);c.strokeStyle='#161a26';c.lineWidth=14;c.strokeRect(595,635,310,330);

let T=0;

 c.font=font;c.letterSpacing='0px';const ch=[...str],ws=ch.map(k=>c.measureText(k).width),tot=ws.reduce((s,w)=>s+w,0)+track*(ch.length-1);let x=cx-tot/2;

 ch.forEach((k,i)=>{const p=eo(seg(T,t0+i*per,t0+i*per+dur)),al=a*p*ao;if(al>.003){c.fillStyle=`rgba(${col},${al})`;c.fillText(k,x,y+(1-p)*rise)}x+=ws[i]+track});c.restore()}

 c.font='700 28px Inter';c.letterSpacing='3px';c.textAlign='center';c.shadowColor='rgba(0,0,0,.9)';c.shadowBlur=12;c.fillText(txt,x,y);c.restore()}

 if(!s.cta&&t<8.6){const k=clockAt(t),ca=eo(seg(t,.15,.5))*(1-eio(seg(t,8.1,8.4)));c.save();c.globalAlpha=ca;c.textAlign='center';c.textBaseline='alphabetic';
