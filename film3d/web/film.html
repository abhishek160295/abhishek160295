<script type="module">
import * as THREE from 'three';

// ------------------------------------------------------------------ helpers
const W = 1920, H = 1080;
const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
const seg = (t, a, b) => clamp((t - a) / (b - a));
const sm = x => { x = clamp(x); return x * x * (3 - 2 * x); };
const eout = x => 1 - Math.pow(1 - clamp(x), 3);

const backE = x => { x = clamp(x); const c = 1.7; return 1 + (c + 1) * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2); };
function rng(seed) { return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const R = rng(7);

await document.fonts.load('80px Gaegu');
await document.fonts.load('40px Hand');

function textTex(lines, w, h, opts = {}) {
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  const g = c.getContext('2d');
  if (opts.bg) { g.fillStyle = opts.bg; g.fillRect(0, 0, w, h); }
  g.fillStyle = opts.color || '#fff'; g.textAlign = 'center'; g.textBaseline = 'middle';
  g.font = opts.font || `${Math.floor(h * 0.6)}px Gaegu`;
  if (opts.glow) { g.shadowColor = opts.glow; g.shadowBlur = opts.blur || 20; }
  const L = Array.isArray(lines) ? lines : [lines];
  L.forEach((s, i) => g.fillText(s, w / 2, h * (i + 0.5) / L.length + (opts.dy || 0)));
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 4; return t;
}

// ------------------------------------------------------------------ renderer
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setSize(W, H); renderer.setPixelRatio(1);

const scene = new THREE.Scene();
const pmrem = new THREE.PMREMGenerator(renderer);
const envTex = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
scene.environment = envTex; scene.environmentIntensity = 0.6;
const fog = new THREE.FogExp2(0x040509, 0.018); scene.fog = fog;
const camera = new THREE.PerspectiveCamera(38, W / H, 0.05, 900);

// sky dome with vertical gradient (night -> dawn mixes per frame)
const skyU = { top: { value: new THREE.Color(0x020308) }, mid: { value: new THREE.Color(0x05070f) }, bot: { value: new THREE.Color(0x020204) }, sunDir: { value: new THREE.Vector3(0, 0.05, -1) }, sunCol: { value: new THREE.Color(0x000000) } };
const sky = new THREE.Mesh(new THREE.SphereGeometry(600, 48, 24), new THREE.ShaderMaterial({
  side: THREE.BackSide, depthWrite: false, fog: false, uniforms: skyU,
  vertexShader: `varying vec3 vW; void main(){ vW = normalize(position); gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }`,
  fragmentShader: `uniform vec3 top, mid, bot, sunCol; uniform vec3 sunDir; varying vec3 vW;
    void main(){ float h = vW.y; vec3 c = h > 0.0 ? mix(mid, top, smoothstep(0.0, 0.6, h)) : mix(mid, bot, smoothstep(0.0, -0.4, h));
      float s = max(dot(normalize(vW), normalize(sunDir)), 0.0); c += sunCol * (pow(s, 6.0) * 0.6 + pow(s, 80.0) * 2.0);
      gl_FragColor = vec4(c, 1.0); }`
}));
scene.add(sky);

// stars
{
  const g = new THREE.BufferGeometry(); const p = [];
  for (let i = 0; i < 2500; i++) { const v = new THREE.Vector3(R() - 0.5, R() * 0.9 - 0.2, R() - 0.5).normalize().multiplyScalar(500); p.push(v.x, v.y, v.z); }
  g.setAttribute('position', new THREE.Float32BufferAttribute(p, 3));
  var stars = new THREE.Points(g, new THREE.PointsMaterial({ color: 0xaab4ff, size: 1.3, sizeAttenuation: false, fog: false, transparent: true }));
  scene.add(stars);
}

// lights
const hemi = new THREE.HemisphereLight(0x6070a0, 0x101010, 0.35); scene.add(hemi);
const key = new THREE.SpotLight(0xffd2a0, 120, 40, 0.55, 0.5, 1.6); key.castShadow = true; key.shadow.mapSize.set(2048, 2048); key.shadow.bias = -0.0004;
scene.add(key); scene.add(key.target);
const redL = new THREE.PointLight(0xff2010, 0, 30, 1.6); scene.add(redL);
const goldL = new THREE.PointLight(0xffc070, 0, 12, 1.8); scene.add(goldL);
const sunL = new THREE.DirectionalLight(0xffb070, 0); sunL.castShadow = true; sunL.shadow.mapSize.set(2048, 2048);
sunL.shadow.camera.left = -12; sunL.shadow.camera.right = 12; sunL.shadow.camera.top = 12; sunL.shadow.camera.bottom = -12; sunL.shadow.camera.far = 120;
scene.add(sunL); scene.add(sunL.target);

// ------------------------------------------------------------------ hero: Leo
const cream = new THREE.MeshPhysicalMaterial({ color: 0xcfc4ad, roughness: 0.58, clearcoat: 0.12, clearcoatRoughness: 0.5, envMapIntensity: 0.28 });
const ink = new THREE.MeshStandardMaterial({ color: 0x0c0a0a, roughness: 0.25 });
function makeLeo() {
  const root = new THREE.Group();
  const body = new THREE.Group(); root.add(body);
  const torso = new THREE.Mesh(new THREE.CapsuleGeometry(0.46, 0.78, 20, 40), cream);
  torso.position.y = 0.95; torso.castShadow = true; torso.receiveShadow = true; body.add(torso);
  const head = new THREE.Group(); head.position.y = 1.45; body.add(head);
  const eyes = [], lids = [], irises = [];
  for (const s of [-1, 1]) {
    const e = new THREE.Group(); e.position.set(s * 0.16, 0.0, 0.415); head.add(e);
    const ball = new THREE.Mesh(new THREE.SphereGeometry(0.075, 24, 16), ink); ball.scale.z = 0.5; e.add(ball);
    const hl = new THREE.Mesh(new THREE.SphereGeometry(0.022, 12, 8), new THREE.MeshBasicMaterial({ color: 0xffffff })); hl.position.set(-0.025, 0.03, 0.035); e.add(hl);
    const iris = new THREE.Mesh(new THREE.SphereGeometry(0.06, 20, 12), new THREE.MeshBasicMaterial({ color: 0xffd27a, transparent: true, opacity: 0 })); iris.scale.z = 0.4; iris.position.z = 0.02; e.add(iris);
    const lid = new THREE.Mesh(new THREE.SphereGeometry(0.088, 24, 12, 0, Math.PI * 2, 0, Math.PI / 2), cream); lid.rotation.x = Math.PI / 2 * 0.0; lid.position.z = 0.0; e.add(lid);
    const brow = new THREE.Mesh(new THREE.CapsuleGeometry(0.018, 0.11, 6, 12), ink); brow.rotation.z = Math.PI / 2; brow.position.set(0, 0.13, 0.01); e.add(brow);
    eyes.push(e); lids.push(lid); irises.push(iris); e.userData.brow = brow;
  }
  const mouth = new THREE.Mesh(new THREE.TorusGeometry(0.07, 0.014, 8, 24, Math.PI), ink); mouth.position.set(0, -0.2, 0.43); mouth.rotation.z = Math.PI; head.add(mouth);
  const band = new THREE.Mesh(new THREE.TorusGeometry(0.345, 0.045, 12, 48), new THREE.MeshStandardMaterial({ color: 0xc8121a, roughness: 0.5, envMapIntensity: 0.3 }));
  band.rotation.x = Math.PI / 2 - 0.12; band.position.y = 0.205; band.visible = false; head.add(band);
  const limb = (len) => { const g = new THREE.Group(); const m = new THREE.Mesh(new THREE.CapsuleGeometry(0.1, len, 8, 16), cream); m.position.y = -len / 2 - 0.05; m.castShadow = true; g.add(m); return g; };
  const armL = limb(0.42), armR = limb(0.42), legL = limb(0.32), legR = limb(0.32);
  armL.position.set(-0.47, 1.12, 0); armR.position.set(0.47, 1.12, 0); legL.position.set(-0.2, 0.52, 0); legR.position.set(0.2, 0.52, 0);
  body.add(armL, armR, legL, legR);

}
const leo = makeLeo(); scene.add(leo);
function pose(L, p) {
  const u = L.userData;
  u.lids.forEach((l, i) => { const c = p.lid ?? 0; l.rotation.x = lerp(-Math.PI * 0.55, 0.15, c); l.visible = c > 0.02; });
  u.eyes.forEach((e, i) => { const s = i === 0 ? -1 : 1; e.userData.brow.rotation.z = Math.PI / 2 + s * (p.brow ?? 0) * 0.5; e.userData.brow.position.y = 0.13 + (p.browY ?? 0); });
  u.irises.forEach(ir => ir.material.opacity = p.fire ?? 0);
  u.mouth.rotation.z = (p.smile ?? 0) > 0 ? 0 : Math.PI; u.mouth.position.y = (p.smile ?? 0) > 0 ? -0.16 : -0.2;
  u.mouth.scale.set(1, Math.abs(p.smile ?? -0.3) + 0.2, 1);
  u.band.visible = !!p.band;
  u.armL.rotation.set(p.armLx ?? 0, 0, p.armLz ?? 0.12); u.armR.rotation.set(p.armRx ?? 0, 0, p.armRz ?? -0.12);
  u.legL.rotation.x = p.legL ?? 0; u.legR.rotation.x = p.legR ?? 0;
  u.body.position.y = p.bob ?? 0; u.body.rotation.x = p.lean ?? 0;
  u.head.rotation.set(p.headX ?? 0, p.headY ?? 0, 0);
}

// ------------------------------------------------------------------ act 1: the void of clocks
const clockTex = textTex('05:00', 256, 128, { bg: '#0a0303', color: '#ff2a1c', glow: '#ff0000', blur: 18, font: 'bold 88px monospace' });
const clockTex2 = textTex('05:05', 256, 128, { bg: '#0a0303', color: '#ff2a1c', glow: '#ff0000', blur: 18, font: 'bold 88px monospace' });
const clockScreen = new THREE.MeshStandardMaterial({ map: clockTex, emissive: 0xffffff, emissiveMap: clockTex, emissiveIntensity: 1.6, roughness: 0.3 });
const clockBody = new THREE.MeshStandardMaterial({ color: 0x16161a, roughness: 0.35, metalness: 0.5 });
const clocks = new THREE.Group(); scene.add(clocks);
const clockData = [];
for (let i = 0; i < 170; i++) {
  const g = new THREE.Group();
  const b = new THREE.Mesh(new RoundedBoxGeometry(1.5, 0.8, 0.6, 3, 0.08), clockBody); g.add(b);
  const s = new THREE.Mesh(new THREE.PlaneGeometry(1.3, 0.62), clockScreen); s.position.z = 0.305; g.add(s);
  const a = R() * Math.PI * 2, r = 2.5 + Math.pow(R(), 0.7) * 16;
  g.position.set(Math.cos(a) * r, Math.sin(a) * r * 0.7 + 2, 20 + R() * 190);
  g.userData = { rx: (R() - 0.5) * 0.8, ry: (R() - 0.5) * 0.8, ph: R() * 6.28, base: g.position.clone(), sp: 0.3 + R() * 0.6 };
  clocks.add(g); clockData.push(g);
}

// ------------------------------------------------------------------ act 2: the floating bedroom
const room = new THREE.Group(); scene.add(room);
const stone = new THREE.MeshStandardMaterial({ color: 0x2a2a30, roughness: 0.85 });
const island = new THREE.Mesh(new THREE.CylinderGeometry(5.2, 3.2, 2.6, 48, 1), stone); island.position.y = -1.3; island.receiveShadow = true; room.add(island);
const floorTop = new THREE.Mesh(new THREE.CylinderGeometry(5.2, 5.2, 0.08, 48), new THREE.MeshStandardMaterial({ color: 0x3a3028, roughness: 0.6 })); floorTop.position.y = 0.0; floorTop.receiveShadow = true; room.add(floorTop);
const wood = new THREE.MeshStandardMaterial({ color: 0x4a3426, roughness: 0.6 });
const bed = new THREE.Group(); room.add(bed); bed.position.set(-0.6, 0, -0.4);
{
  const frame = new THREE.Mesh(new RoundedBoxGeometry(2.6, 0.45, 1.5, 2, 0.05), wood); frame.position.y = 0.25; frame.castShadow = frame.receiveShadow = true; bed.add(frame);
  const head = new THREE.Mesh(new RoundedBoxGeometry(0.15, 1.1, 1.5, 2, 0.05), wood); head.position.set(-1.3, 0.55, 0); head.castShadow = true; bed.add(head);
  const mat = new THREE.Mesh(new RoundedBoxGeometry(2.4, 0.25, 1.35, 3, 0.1), new THREE.MeshStandardMaterial({ color: 0x9c978e, roughness: 0.95, envMapIntensity: 0.3 })); mat.position.y = 0.58; mat.receiveShadow = true; bed.add(mat);
  const pil = new THREE.Mesh(new RoundedBoxGeometry(0.55, 0.18, 0.9, 4, 0.08), new THREE.MeshStandardMaterial({ color: 0xb4b0a8, roughness: 0.95, envMapIntensity: 0.3 })); pil.position.set(-0.9, 0.78, 0); bed.add(pil);
}
const blanket = new THREE.Mesh(new RoundedBoxGeometry(1.6, 0.3, 1.45, 4, 0.13), new THREE.MeshStandardMaterial({ color: 0x2c3a66, roughness: 0.85 }));
blanket.position.set(-0.1, 0.84, -0.4); blanket.castShadow = true; room.add(blanket);
const stand = new THREE.Mesh(new RoundedBoxGeometry(0.7, 0.7, 0.6, 2, 0.04), wood); stand.position.set(1.35, 0.35, -0.6); stand.castShadow = true; room.add(stand);
const miniClock = new THREE.Group(); miniClock.position.set(1.35, 0.92, -0.55); room.add(miniClock);
{ const b = new THREE.Mesh(new RoundedBoxGeometry(0.5, 0.26, 0.2, 2, 0.03), clockBody); miniClock.add(b); const s = new THREE.Mesh(new THREE.PlaneGeometry(0.44, 0.2), clockScreen); s.position.z = 0.101; miniClock.add(s); }
const windowF = new THREE.Group(); windowF.position.set(-2.2, 2.3, -2.4); room.add(windowF);
{
  const fr = new THREE.MeshStandardMaterial({ color: 0x8a8a90, roughness: 0.4, metalness: 0.6 });
  [[0, 0.8, 1.9, 0.08], [0, -0.8, 1.9, 0.08], [-0.95, 0, 0.08, 1.68], [0.95, 0, 0.08, 1.68], [0, 0, 0.05, 1.6], [0, 0, 1.8, 0.05]].forEach(([x, y, w, h]) => { const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, 0.08), fr); m.position.set(x, y, 0); windowF.add(m); });
  const glass = new THREE.Mesh(new THREE.PlaneGeometry(1.8, 1.6), new THREE.MeshBasicMaterial({ color: 0x0b1530 })); glass.position.z = -0.02; windowF.add(glass);
  const moon = new THREE.Mesh(new THREE.CircleGeometry(0.16, 24), new THREE.MeshBasicMaterial({ color: 0xdfe6ff })); moon.position.set(0.45, 0.4, -0.01); windowF.add(moon);
}

// the SNOOZE monolith
const snooze = new THREE.Group(); scene.add(snooze); snooze.position.set(4.3, -9, -1.6);
const snoozeTop = textTex(['SNOOZE'], 512, 512, { bg: '#c40a0a', color: '#ffe8e0', glow: '#fff', blur: 12, font: '150px Gaegu' });
const redMat = new THREE.MeshStandardMaterial({ color: 0xc8100c, emissive: 0xff1608, emissiveIntensity: 0.9, roughness: 0.28, metalness: 0.1 });
const capMat = new THREE.MeshStandardMaterial({ map: snoozeTop, emissive: 0xffffff, emissiveMap: snoozeTop, emissiveIntensity: 0.32, roughness: 0.45, envMapIntensity: 0.2 });
const btnCap = new THREE.Mesh(new THREE.CylinderGeometry(1.7, 1.75, 0.7, 64), [redMat, capMat, redMat]); btnCap.position.y = 6.35; btnCap.rotation.y = -0.6; snooze.add(btnCap);
const pedestal = new THREE.Mesh(new THREE.CylinderGeometry(2.1, 2.5, 6, 64), new THREE.MeshStandardMaterial({ color: 0x18181c, roughness: 0.3, metalness: 0.85 })); pedestal.position.y = 3; pedestal.castShadow = true; snooze.add(pedestal);
const ringMat = new THREE.MeshBasicMaterial({ color: 0xff3020, transparent: true, opacity: 0, side: THREE.DoubleSide, fog: false });
const shock = new THREE.Mesh(new THREE.TorusGeometry(1, 0.06, 8, 96), ringMat); shock.rotation.x = Math.PI / 2; scene.add(shock);

// ------------------------------------------------------------------ act 3: the tower of excuses
const font = await new Promise(res => new FontLoader().load('fonts/helvetiker_bold.typeface.json', res));
const WORDS = ['LATER', 'MONDAY', 'TOMORROW', 'TIRED', 'NOT TODAY', 'ONE MORE EPISODE', 'NEXT WEEK', 'NO TIME', 'TOO HARD', 'YOU EARNED IT', 'SKIP IT', 'WHY BOTHER'];
const exMat = new THREE.MeshStandardMaterial({ color: 0x220405, emissive: 0xff1a0e, emissiveIntensity: 0.9, roughness: 0.3, metalness: 0.4 });
const exSide = new THREE.MeshStandardMaterial({ color: 0x150304, roughness: 0.35, metalness: 0.6 });
const blocks = [];
const rB = rng(21);
for (let i = 0; i < 40; i++) {
  const w = WORDS[i % WORDS.length];
  const g = new TextGeometry(w, { font, size: 0.42, depth: 0.32, curveSegments: 4, bevelEnabled: true, bevelThickness: 0.03, bevelSize: 0.02, bevelSegments: 2 });
  g.computeBoundingBox(); const bb = g.boundingBox; g.translate(-(bb.max.x + bb.min.x) / 2, -(bb.max.y + bb.min.y) / 2, -0.16);
  const m = new THREE.Mesh(g, [exMat, exSide]); m.castShadow = true;
  const layer = Math.floor(i / 6), k = i % 6;
  const ang = k * Math.PI / 3 + layer * 0.5 + (rB() - 0.5) * 0.3;
  const rad = 1.55 - layer * 0.05 + (rB() - 0.5) * 0.25;
  const rest = new THREE.Vector3(Math.cos(ang) * rad, 0.3 + layer * 0.52 + rB() * 0.1, Math.sin(ang) * rad);
  const outward = Math.PI / 2 - ang; const facesCam = Math.cos(ang) * 1.0 + Math.sin(ang) * 0.07 > -0.15;
  const rot = new THREE.Euler((rB() - 0.5) * 0.4, outward + (facesCam ? 0 : Math.PI) + (rB() - 0.5) * 0.4, (rB() - 0.5) * 0.5);
  const tDrop = 30.4 + i * 0.36 + rB() * 0.12;
  const vel = new THREE.Vector3(rest.x, 0, rest.z).normalize().multiplyScalar(7 + rB() * 9); vel.y = 4 + rB() * 9;
  m.userData = { rest, rot, tDrop, vel, spin: new THREE.Vector3(rB() * 6 - 3, rB() * 6 - 3, rB() * 6 - 3) };
  m.visible = false; scene.add(m); blocks.push(m);
}
// embers
const emG = new THREE.BufferGeometry(); const emN = 600; const emP = new Float32Array(emN * 3); const emSeed = [];
for (let i = 0; i < emN; i++) emSeed.push([R() * 6.28, R() * 4 + 0.5, R() * 14, R() * 0.6 + 0.2]);
emG.setAttribute('position', new THREE.BufferAttribute(emP, 3));
const embers = new THREE.Points(emG, new THREE.PointsMaterial({ color: 0xff5530, size: 0.07, transparent: true, opacity: 0, blending: THREE.AdditiveBlending, depthWrite: false }));
scene.add(embers);

// ------------------------------------------------------------------ act 4: the staircase of days
const STEPS = 400, SR = 6.5, DTH = 0.2, DY = 0.33;
const stepGeo = new RoundedBoxGeometry(2.4, 0.22, 1.25, 2, 0.05);
const stepMat = new THREE.MeshStandardMaterial({ color: 0x2a2a30, roughness: 0.4, metalness: 0.5, emissive: 0xffb050, emissiveIntensity: 0 });
const stairs = new THREE.InstancedMesh(stepGeo, stepMat, STEPS); stairs.castShadow = true; stairs.receiveShadow = true;
stairs.instanceColor = new THREE.InstancedBufferAttribute(new Float32Array(STEPS * 3), 3);
const tmpM = new THREE.Matrix4(), tmpQ = new THREE.Quaternion(), tmpS = new THREE.Vector3(1, 1, 1);
const stepPos = (k) => { const th = k * DTH; return new THREE.Vector3(Math.cos(th) * SR, k * DY, Math.sin(th) * SR); };
for (let k = 0; k < STEPS; k++) {
  const p = stepPos(k); tmpQ.setFromAxisAngle(new THREE.Vector3(0, 1, 0), -k * DTH);
  tmpM.compose(p, tmpQ, tmpS); stairs.setMatrixAt(k, tmpM); stairs.setColorAt(k, new THREE.Color(0x404048));
}
stairs.visible = false; scene.add(stairs);
const dayLabels = [];
for (let k = 10; k < STEPS; k += 20) {
  const n = Math.round(k / (STEPS - 20) * 365);
  const s = new THREE.Sprite(new THREE.SpriteMaterial({ map: textTex('DAY ' + n, 512, 128, { color: '#ffd9a0', glow: '#ff9a30', blur: 16, font: '84px Gaegu' }), transparent: true, depthWrite: false }));
  const p = stepPos(k); s.position.set(p.x * 1.22, p.y + 0.55, p.z * 1.22); s.scale.set(1.9, 0.48, 1); s.visible = false; scene.add(s); dayLabels.push(s);

    const lookDown = sm(seg(t, 99.6, 100.3));
    const lift = sm(seg(t, 100.4, 100.9)) * (1 - sm(seg(t, 101.0, 101.2)));
    P = { lid: lerp(0, 0.45, lookDown), brow: lerp(0.3, -0.1, lookDown), smile: lookDown > 0.5 ? 0.2 : 0.5, band: true, headX: 0.45 * lookDown, headY: 0.3 * lookDown, legR: -1.0 * lift };
    leo.position.x += lift * 0.15;
    skyU.top.value.set(0x24345a); skyU.mid.value.set(0xff8a4a); skyU.bot.value.set(0x40242a); skyU.sunCol.value.set(0xffa060); skyU.sunDir.value.set(-0.6, 0.08, -1);
    stars.material.opacity = 0; fog.color.set(0x4a3440); fog.density = 0.0016;
    sun.position.set(-260, 150, -430);
    look(V(sp.x + 0.5, sp.y + 1.8, sp.z + 4.2), V(sp.x + 0.25, sp.y + 1.0, sp.z));
    key.position.set(sp.x + 3, sp.y + 6, sp.z + 4); key.target.position.copy(sp); key.intensity = 14;
    sunL.intensity = 1.8; sunL.position.set(sp.x - 60, sp.y + 25, sp.z - 100); sunL.target.position.copy(sp);
    hemi.intensity = 0.55; bloomS = 0.45;
    redL.position.set(tiny.position.x, tiny.position.y + 0.3, tiny.position.z); redL.intensity = stomp ? 0 : 1.2;
    if (t > 101.2) shake(0.03 * Math.exp(-(t - 101.2) * 8), t);
    const b = sm(seg(t, 101.5, 101.9));
    $('black').style.opacity = b;
    if (t > 101.9) { $('big').querySelector('.l1').textContent = 'DISCIPLINE'; $('big').querySelector('.l2').textContent = "doesn't negotiate."; $('big').style.opacity = sm(seg(t, 102.0, 102.4)); }
  }
  pose(leo, P);

  // overlays
  let cs = '', ca = 0;
  for (const [a, b, s] of CAPS) if (t >= a && t <= b) { cs = s; ca = sm(seg(t, a, a + 0.25)) * (1 - sm(seg(t, b - 0.3, b))); }
  caption(cs, ca);
  for (const [a, b, s, y] of VILS) if (t >= a && t <= b) {
    const n = Math.round(s.length * clamp((t - a) / 0.6));
    $('vil').textContent = s.slice(0, n); $('vil').style.top = (y * 1080) + 'px';
    $('vil').style.opacity = 1 - sm(seg(t, b - 0.4, b));
    $('vil').style.transform = `translateX(${Math.sin(t * 40) * 2}px)`;
  }
  if (t < 101.9) $('big').style.opacity = 1;

  renderer.toneMappingExposure = exposure; bloom.strength = bloomS; grade.uniforms.ab.value = ab;
  composer.render();
  return true;
};
window.ready = true;
</script>
</body>
