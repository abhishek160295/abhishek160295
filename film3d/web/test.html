<!doctype html><html><head><style>html,body{margin:0;background:#000;overflow:hidden}</style>
<script type="importmap">{"imports":{"three":"./three/build/three.module.js","three/addons/":"./three/examples/jsm/"}}</script></head>
<body><script type="module">
import * as THREE from 'three';
import {EffectComposer} from 'three/addons/postprocessing/EffectComposer.js';
import {RenderPass} from 'three/addons/postprocessing/RenderPass.js';
import {UnrealBloomPass} from 'three/addons/postprocessing/UnrealBloomPass.js';
import {OutputPass} from 'three/addons/postprocessing/OutputPass.js';
const W=1920,H=1080;
const r=new THREE.WebGLRenderer({antialias:true,preserveDrawingBuffer:true});
r.setSize(W,H);r.shadowMap.enabled=true;r.shadowMap.type=THREE.PCFSoftShadowMap;r.toneMapping=THREE.ACESFilmicToneMapping;
document.body.appendChild(r.domElement);
const sc=new THREE.Scene();sc.fog=new THREE.FogExp2(0x05060a,0.04);sc.background=new THREE.Color(0x05060a);
const cam=new THREE.PerspectiveCamera(40,W/H,0.1,200);
const hero=new THREE.Mesh(new THREE.CapsuleGeometry(0.5,0.9,16,32),new THREE.MeshStandardMaterial({color:0xeee4d0,roughness:0.45}));
hero.position.y=1;hero.castShadow=true;sc.add(hero);
for(const s of [-1,1]){const e=new THREE.Mesh(new THREE.SphereGeometry(0.06,16,16),new THREE.MeshBasicMaterial({color:0x111111}));e.position.set(s*0.17,1.45,0.47);sc.add(e);}
const g=new THREE.Mesh(new THREE.PlaneGeometry(60,60),new THREE.MeshStandardMaterial({color:0x222226,roughness:0.9}));g.rotation.x=-Math.PI/2;g.receiveShadow=true;sc.add(g);
const btn=new THREE.Mesh(new THREE.CylinderGeometry(1.2,1.3,0.5,48),new THREE.MeshStandardMaterial({color:0xff1010,emissive:0xff0000,emissiveIntensity:2}));btn.position.set(2.5,0.25,-2);sc.add(btn);
const key=new THREE.SpotLight(0xffd7a0,80,30,0.5,0.4);key.position.set(-3,6,4);key.castShadow=true;key.shadow.mapSize.set(2048,2048);sc.add(key);
sc.add(new THREE.AmbientLight(0x334466,0.4));
const red=new THREE.PointLight(0xff2010,30,12);red.position.set(2.5,1.5,-2);sc.add(red);
const comp=new EffectComposer(r);comp.addPass(new RenderPass(sc,cam));comp.addPass(new UnrealBloomPass(new THREE.Vector2(W,H),0.9,0.6,0.85));comp.addPass(new OutputPass());
window.renderAt=(t)=>{cam.position.set(Math.sin(t*0.5)*6,2.2,Math.cos(t*0.5)*6);cam.lookAt(0,1,0);hero.position.y=1+Math.sin(t*3)*0.05;comp.render();return 1;};
window.ready=true;
</script></body></html>
