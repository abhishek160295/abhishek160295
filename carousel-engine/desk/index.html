<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Data Guy Content Desk</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Manrope:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap">
<style>
:root{--bg:#F6F6F2;--surface:#FFFFFF;--ink:#17191E;--muted:#676B73;--line:#E3E3DC;--accent:#0E6B68;--accent-ink:#FFFFFF;--pend:#B7791F;--pend-bg:#FBF1DE;--ok:#23804A;--ok-bg:#E3F3E8;--bad:#B4382E;--bad-bg:#F8E4E1;--done:#4B4F9C;--done-bg:#E7E8F7;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121418;--surface:#1B1E24;--ink:#ECECE6;--muted:#9A9EA6;--line:#2C3038;--accent:#3FB5AE;--accent-ink:#0B1413;--pend:#E7B45A;--pend-bg:#3A2E17;--ok:#5CCB86;--ok-bg:#16301F;--bad:#EE7C70;--bad-bg:#3A1C19;--done:#A5A9F0;--done-bg:#23254A;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#121418;--surface:#1B1E24;--ink:#ECECE6;--muted:#9A9EA6;--line:#2C3038;--accent:#3FB5AE;--accent-ink:#0B1413;--pend:#E7B45A;--pend-bg:#3A2E17;--ok:#5CCB86;--ok-bg:#16301F;--bad:#EE7C70;--bad-bg:#3A1C19;--done:#A5A9F0;--done-bg:#23254A;color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:15px/1.55 Manrope,system-ui,sans-serif;padding-inline:16px;padding-block:28px 60px}
.wrap{max-width:1100px;margin:0 auto;display:grid;gap:28px}
header{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:18px}
h1{font:800 clamp(30px,5vw,44px)/1 'Bricolage Grotesque',Manrope,sans-serif;margin:0;letter-spacing:-.02em}
.sub{color:var(--muted);margin:6px 0 0}
.mono{font-family:'JetBrains Mono',ui-monospace,monospace;font-size:12px;letter-spacing:.04em}
.counts{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:7px 14px;font:600 13px Manrope,sans-serif;cursor:pointer;display:inline-flex;gap:8px;align-items:center}
.chip b{font-variant-numeric:tabular-nums}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.day{display:grid;gap:14px}
.day h2{font:600 18px 'Bricolage Grotesque',sans-serif;margin:0;display:flex;gap:10px;align-items:baseline}
.post{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px;display:grid;gap:14px}
.meta{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;color:var(--muted)}
.st{font:700 11px Manrope,sans-serif;text-transform:uppercase;letter-spacing:.08em;padding:4px 10px;border-radius:999px}
.st.draft{color:var(--pend);background:var(--pend-bg)}.st.approved{color:var(--ok);background:var(--ok-bg)}.st.rejected{color:var(--bad);background:var(--bad-bg)}.st.posted{color:var(--done);background:var(--done-bg)}
.post h3{font:600 21px/1.25 'Bricolage Grotesque',sans-serif;margin:0;text-wrap:balance}
.strip{display:flex;gap:10px;overflow-x:auto;padding-bottom:6px;scroll-snap-type:x mandatory}
.strip button{flex:0 0 auto;width:min(150px,38vw);aspect-ratio:4/5;border:1px solid var(--line);border-radius:8px;padding:0;overflow:hidden;cursor:zoom-in;background:var(--bg);scroll-snap-align:start}
.strip img{width:100%;height:100%;object-fit:cover;display:block}
.cap{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:14px;white-space:pre-wrap;max-height:130px;overflow:auto;font-size:14px}
.cap.open{max-height:none}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.btn{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:9px;padding:9px 14px;font:600 14px Manrope,sans-serif;cursor:pointer}
.btn:hover{border-color:var(--ink)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.warn{color:var(--bad)}
.btn[disabled]{opacity:.45;cursor:default}
.sp{flex:1}
.src{font-size:13px;color:var(--muted)}.src a{color:var(--accent)}
.empty{color:var(--muted);text-align:center;padding:40px 0}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:600}
.lb{position:fixed;inset:0;background:rgba(10,11,14,.88);display:grid;place-items:center;padding:16px;z-index:9}
.lb img{max-height:86vh;max-width:min(100%,560px);border-radius:10px}
.lb .nav{position:absolute;bottom:calc(18px + env(safe-area-inset-bottom,0px));display:flex;flex-wrap:wrap;justify-content:center;gap:8px;padding-inline:12px}
.lb .btn{background:#fff;color:#111;border-color:#fff}
.lbl{font:700 12px 'JetBrains Mono',monospace;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:8px}
.cvrow{display:flex;gap:12px;flex-wrap:wrap}
.cv{border:2px solid var(--line);background:var(--surface);border-radius:12px;padding:6px;cursor:pointer;display:flex;flex-direction:column;gap:6px;width:min(170px,42vw);color:var(--ink);font:600 13px Manrope,sans-serif;text-align:left}
.cv img{width:100%;aspect-ratio:4/5;object-fit:cover;border-radius:8px;display:block}
.cv.on{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent)}
.rvrow{display:flex;gap:14px;flex-wrap:wrap}
.rv{display:flex;gap:12px;align-items:flex-start;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:10px;max-width:100%}
.kit{margin:12px 0;border:1.5px solid var(--line);border-radius:12px;padding:14px;background:var(--bg)}.kit .kr{margin-bottom:12px}.kit .kv{white-space:pre-wrap;font-size:15px;line-height:1.5}.kit .hk{font-weight:800;font-size:18px}.rtag{background:#E0561F;color:#fff;padding:2px 8px;border-radius:6px;font:700 12px 'JetBrains Mono',monospace}
.x-unused{width:min(150px,36vw);aspect-ratio:9/16;border-radius:8px;background:#000;display:block}
.rvm{display:flex;flex-direction:column;gap:8px;font-size:14px;min-width:0}
@media (prefers-reduced-motion:no-preference){.post{transition:border-color .15s}}

[hidden]{display:none!important}
.reelbox{display:flex;gap:16px;flex-wrap:wrap;align-items:flex-start}
.reelbox video{width:min(280px,70vw);aspect-ratio:9/16;border-radius:14px;background:#000;display:block}
.reelmeta{display:grid;gap:10px;align-content:start}
.repl{display:flex;flex-wrap:wrap;gap:10px;align-items:center;background:var(--bad-bg);color:var(--bad);border-radius:10px;padding:10px 12px;font-weight:600}
.repl b{font-variant-numeric:tabular-nums}.repl.on{background:var(--pend-bg);color:var(--pend)}
.daybar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.daybar input{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:9px;padding:8px 10px;font:600 14px Manrope,sans-serif}
.kw{font:700 13px 'JetBrains Mono',monospace;background:var(--pend-bg);color:var(--pend);padding:4px 10px;border-radius:8px}
.lk{font-size:13px;color:var(--muted)}.lk a{color:var(--accent)}
a.btn{text-decoration:none;display:inline-flex;align-items:center}
</style></head><body>
<div class="wrap">
  <header>
    <div>
      <div class="mono" style="color:var(--accent)">@THEDATAGUY16 · CAROUSEL DESK</div>
      <h1>Content Desk</h1>
      <p class="sub">Four carousels a day. Approve, pick the cover, save, post with music.</p>
    </div>
    <div style="display:grid;gap:10px;justify-items:end">
      <div class="daybar"><button class="chip" id="prevd">&larr;</button><input type="date" id="day" aria-label="Day"><button class="chip" id="nextd">&rarr;</button><button class="chip" id="alld" aria-pressed="false">All days</button></div>
      <div class="counts" id="filters" role="group" aria-label="Filter by status"></div>
    </div>
  </header>
  <main id="list"><p class="empty">Loading the queue…</p></main>
</div>
<div class="lb" id="lb" hidden><img id="lbimg" alt=""><div class="nav"><button class="btn" id="lbp">&larr; Prev</button><button class="btn" id="lbc">Close</button><button class="btn" id="lbn">Next &rarr;</button></div></div>
<div class="toast" id="toast" hidden></div>
<script>
const LABEL={draft:'Needs review',approved:'Approved',rejected:'Rejected',posted:'Posted'};
let posts=[],filter='all',day=null,allDays=false,lbSet=[],lbI=0,auto={replaceAfterMinutes:20,running:{}};
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function toast(t){const e=$('#toast');e.textContent=t;e.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>e.hidden=true,2200)}
function fmtDay(d){try{return new Date(d+'T00:00:00').toLocaleDateString('en-IN',{weekday:'long',day:'numeric',month:'short'})}catch{return d}}
function istToday(){return new Date(Date.now()+330*60000).toISOString().slice(0,10)}
async function load(){posts=await (await fetch('/api/posts')).json();try{auto=await (await fetch('/api/auto')).json()}catch{}
  if(!day){const days=[...new Set(posts.map(p=>p.date))].sort();day=days.includes(istToday())?istToday():(days.at(-1)||istToday())}
  $('#day').value=day;render()}
function inScope(p){return allDays||p.date===day}
function renderFilters(){
  const sc=posts.filter(inScope);const n=k=>k==='all'?sc.length:sc.filter(p=>p.status===k).length;
  $('#filters').innerHTML=['all','draft','approved','posted','rejected'].map(k=>`<button class="chip" data-f="${k}" aria-pressed="${filter===k}">${k==='all'?'All':LABEL[k]} <b>${n(k)}</b></button>`).join('');
  $('#alld').setAttribute('aria-pressed',allDays)}
function render(){
  renderFilters();
  const vis=posts.filter(p=>inScope(p)&&(filter==='all'||p.status===filter)).sort((a,b)=>(b.date||'').localeCompare(a.date||'')||(a.slotTime||'').localeCompare(b.slotTime||'')||String(a.id).localeCompare(String(b.id)));
  if(!vis.length){$('#list').innerHTML=`<p class="empty">Nothing here for ${allDays?'any day':esc(fmtDay(day))}. The next batch lands at 05:50 IST.</p>`;return}
  const days={};vis.forEach(p=>(days[p.date]??=[]).push(p));
  $('#list').innerHTML=Object.entries(days).map(([d,ps])=>`<section class="day"><h2>${esc(fmtDay(d))} <span class="mono" style="color:var(--muted)">${ps.length} POST${ps.length>1?'S':''}</span></h2>${ps.map(card).join('')}</section>`).join('');
}
function replBox(p){
  if(p.status!=='rejected'||p.replacedBy)return '';
  if(p.noReplace)return `<div class="repl">Kept rejected, no replacement. <button class="btn" data-replnow="${p.id}">Replace it anyway</button></div>`;
  if(auto.running&&auto.running[p.date])return `<div class="repl on">Building the replacement now. It lands here as a draft in a few minutes. Log: logs/${p.date}_replace.log</div>`;
  const due=new Date(p.rejectedAt||Date.now()).getTime()+auto.replaceAfterMinutes*60000,left=Math.max(0,due-Date.now());
  const mm=Math.floor(left/60000),ss=String(Math.floor(left%60000/1000)).padStart(2,'0');
  return `<div class="repl">${left>0?`Auto-replacing in <b data-cd="${due}">${mm}:${ss}</b>`:'Replacement queued'} · new format, new topic, new keyword.
    <button class="btn primary" data-replnow="${p.id}">Replace now</button><button class="btn" data-keep="${p.id}">Keep rejected</button></div>`}
setInterval(()=>document.querySelectorAll('[data-cd]').forEach(e=>{const l=Math.max(0,+e.dataset.cd-Date.now());e.textContent=Math.floor(l/60000)+':'+String(Math.floor(l%60000/1000)).padStart(2,'0');if(!l)load()}),1000);
function slidesOf(p){const a=[...(p.slides||[])];if(p.coverAlt&&p.coverChoice==='b'&&a.length)a[0]=p.coverAlt;return a}
function card(p){
  const sl=slidesOf(p).map((s,i)=>`<button data-lb="${p.id}" data-i="${i}" aria-label="Open slide ${i+1}"><img loading="lazy" src="${esc(s.url)}" alt="Slide ${i+1}"></button>`).join('');
  const act=`${p.status!=='approved'&&p.status!=='posted'?`<button class="btn primary" data-act="approved" data-id="${p.id}">Approve</button>`:''}
    ${p.status==='approved'?`<button class="btn primary" data-act="posted" data-id="${p.id}">Mark posted</button>`:''}
    ${p.status==='draft'?`<button class="btn warn" data-act="rejected" data-id="${p.id}">Reject</button>`:''}
    ${p.status==='approved'||p.status==='rejected'?`<button class="btn" data-act="draft" data-id="${p.id}">Back to review</button>`:''}`;
  const link=[p.replaces?`Replaces <b>${esc(p.replaces)}</b>`:'',p.replacedBy?`Replaced by <b>${esc(p.replacedBy)}</b>`:''].filter(Boolean).join(' · ');
  const src=(p.sources||[]).map(s=>`<a href="${esc(s.url)}" target="_blank" rel="noopener">${esc(s.title)}</a>`).join(' · ');
  return `<article class="post" id="post-${p.id}">
    <div class="meta"><span class="st ${p.status}">${LABEL[p.status]||p.status}</span><span class="mono">SLOT ${p.slot} · ${esc(p.slotTime||'')} IST</span><span class="mono">${esc((p.pillar||'').toUpperCase())}</span><span class="mono">${esc((p.format||'').toUpperCase())}</span><span class="mono">${p.kind==='reel'?'REEL · '+(p.seconds||'?')+' S':(p.slides||[]).length+' SLIDES · '+(p.pdf?p.pdf.pages:'?')+'-PAGE PDF'}</span><span class="kw">${esc(p.keyword)}</span>${p.music?`<span class="mono">♪ ${esc(p.music)}</span>`:''}</div>
    <h3>${esc(p.title)}</h3>
    ${p.why?`<div class="src"><strong style="color:var(--ink)">Why this post:</strong> ${esc(p.why)}</div>`:''}
    ${link?`<div class="lk">${link}</div>`:''}
    ${replBox(p)}
    ${p.coverAlt?`<div class="covers"><div class="lbl">Pick the cover</div><div class="cvrow">
      ${[['a',p.slides[0]],['b',p.coverAlt]].map(([k,c])=>`<button class="cv ${(p.coverChoice||'a')===k?'on':''}" data-cover="${k}" data-id="${p.id}" aria-pressed="${(p.coverChoice||'a')===k}"><img src="${esc(c.url)}" alt="Cover ${k.toUpperCase()}"><span>${(p.coverChoice||'a')===k?'✓ Using ':''}Cover ${k.toUpperCase()}${c.hook?' · '+esc(c.hook):''}</span></button>`).join('')}
    </div></div>`:''}
    ${p.kind==='reel'&&p.video?`<div class="reelbox"><video src="${esc(p.video.url)}" poster="${esc(p.cover?p.cover.url:'')}" controls playsinline preload="metadata"></video>
      <div class="reelmeta"><div class="lbl">Learning reel · ${esc(String(p.seconds||''))} s · original sound, synced</div>
      <a class="btn" href="${esc(p.video.url)}?dl=1" download="${esc(p.video.name)}">Video (mp4)</a>
      ${p.cover?`<a class="btn" href="${esc(p.cover.url)}?dl=1" download="${esc(p.slug)}_cover.jpg">Cover (jpg)</a>`:''}</div></div>`:`<div class="strip">${sl}</div>`}
    <div class="cap" id="cap-${p.id}">${esc(p.caption)}${p.hashtags?'\n\n'+esc(p.hashtags):''}</div>
    <div class="row">${act}<span class="sp"></span>
      <button class="btn" data-copy="${p.id}">Copy caption</button>
      <button class="btn" data-kw="${p.id}">Copy keyword</button>
      ${p.kind==='reel'?'':`<a class="btn" href="/api/posts/${encodeURIComponent(p.id)}/slides.zip">Slides (zip)</a>`}
      ${p.pdf?`<a class="btn" href="${esc(p.pdf.url)}?dl=1" download="${esc(p.pdf.name)}">PDF</a>`:''}
    </div>
    ${src?`<div class="src">Sources: ${src}</div>`:''}
  </article>`}
async function post(url,body){const r=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});if(!r.ok)throw new Error((await r.json()).error)}
async function setStatus(id,status){const p=posts.find(x=>x.id===id);const prev=p.status;p.status=status;if(status==='rejected'){p.rejectedAt=new Date().toISOString();p.noReplace=false}render();
  try{await post(`/api/posts/${encodeURIComponent(id)}/status`,{status});toast(status==='rejected'?`Rejected. Auto-replacing in ${auto.replaceAfterMinutes} min`:LABEL[status])}catch(e){p.status=prev;render();toast('Could not save: '+e.message)}}
async function setCover(id,k){const p=posts.find(x=>x.id===id);if((p.coverChoice||'a')===k)return;const prev=p.coverChoice;p.coverChoice=k;render();
  try{await post(`/api/posts/${encodeURIComponent(id)}/cover`,{choice:k});toast('Cover '+k.toUpperCase()+' selected')}catch(e){p.coverChoice=prev;render();toast('Could not save')}}
async function copy(text,label,el){try{await navigator.clipboard.writeText(text);toast(label+' copied')}catch{if(el){const r=document.createRange();el.classList.add('open');r.selectNodeContents(el);const s=getSelection();s.removeAllRanges();s.addRange(r)}toast('Selected. Copy with your keyboard')}}
function openLb(id,i){const p=posts.find(x=>x.id===id);lbSet=slidesOf(p);lbI=+i;showLb();$('#lb').hidden=false}
function showLb(){$('#lbimg').src=lbSet[lbI].url;$('#lbimg').alt='Slide '+(lbI+1)}
function shiftDay(n){const d=new Date(day+'T00:00:00Z');d.setUTCDate(d.getUTCDate()+n);day=d.toISOString().slice(0,10);allDays=false;$('#day').value=day;render()}
document.addEventListener('click',e=>{const t=e.target.closest('button');if(!t)return;
  if(t.dataset.f){filter=t.dataset.f;render()}
  else if(t.dataset.act)setStatus(t.dataset.id,t.dataset.act);
  else if(t.dataset.copy){const p=posts.find(x=>x.id===t.dataset.copy);copy(p.caption+(p.hashtags?'\n\n'+p.hashtags:''),'Caption',$('#cap-'+p.id))}
  else if(t.dataset.kw){copy(posts.find(x=>x.id===t.dataset.kw).keyword,'Keyword')}
  else if(t.dataset.cover)setCover(t.dataset.id,t.dataset.cover);
  else if(t.dataset.replnow){post(`/api/posts/${encodeURIComponent(t.dataset.replnow)}/replace-now`,{}).then(()=>{toast('Replacement started');setTimeout(load,1500)}).catch(e=>toast('Could not start: '+e.message))}
  else if(t.dataset.keep){post(`/api/posts/${encodeURIComponent(t.dataset.keep)}/keep-rejected`,{}).then(()=>{toast('Kept rejected');load()}).catch(e=>toast('Could not save: '+e.message))}
  else if(t.dataset.lb)openLb(t.dataset.lb,t.dataset.i);
  else if(t.id==='lbc')$('#lb').hidden=true;
  else if(t.id==='lbn'){lbI=(lbI+1)%lbSet.length;showLb()}
  else if(t.id==='lbp'){lbI=(lbI-1+lbSet.length)%lbSet.length;showLb()}
  else if(t.id==='prevd')shiftDay(-1);else if(t.id==='nextd')shiftDay(1);
  else if(t.id==='alld'){allDays=!allDays;render()}});
$('#day').addEventListener('change',e=>{day=e.target.value;allDays=false;render()});
document.addEventListener('keydown',e=>{if($('#lb').hidden)return;if(e.key==='Escape')$('#lb').hidden=true;if(e.key==='ArrowRight')$('#lbn').click();if(e.key==='ArrowLeft')$('#lbp').click()});
load();setInterval(()=>{if(document.visibilityState==='visible'&&$('#lb').hidden)load()},60000);
</script></body></html>
