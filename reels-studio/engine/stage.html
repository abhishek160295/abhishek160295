<!doctype html><html><head><meta charset="utf-8">
<style>
@font-face{font-family:"Silkscreen";src:url("../fonts/Silkscreen-Regular.ttf")}
html,body{margin:0;background:#000}canvas{display:block}
</style></head><body>
<canvas id="c" width="1080" height="1920"></canvas>
<script src="engine.js"></script>
<script>
const q = new URLSearchParams(location.search);
const s = document.createElement("script"); s.src = q.get("scene");
s.onload = async () => {
  await document.fonts.load('30px Silkscreen');
  const ctx = document.getElementById("c").getContext("2d");
  window.frame = (t) => { SCENE.draw(ctx, t); return document.getElementById("c").toDataURL("image/jpeg", 0.95); };
  window.ready = true;
};
document.body.appendChild(s);
</script></body></html>
