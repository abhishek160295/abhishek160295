<!doctype html>
<html><head><meta charset="utf-8"><style>html,body{margin:0;background:#04040A}canvas{display:block}</style></head>
<body><canvas id="c" width="1080" height="1920"></canvas>
<script>
const W=1080,H=1920,T=20,TAU=Math.PI*2;
const c=document.getElementById('c'),g=c.getContext('2d');
let seed=7;const rnd=()=>(seed=(seed*16807)%2147483647)/2147483647;

// Starfield
const stars=[...Array(500)].map(()=>({x:(rnd()-.5)*4000,y:(rnd()-.5)*6000,z:rnd(),s:rnd()}));
// Network: layers in 3D
const layers=[10,16,16,16,10];const nodes=[];
layers.forEach((n,li)=>{for(let i=0;i<n;i++){const a=i/n*TAU;const r=li==0||li==layers.length-1?260:340;
nodes.push({li,x:(li-(layers.length-1)/2)*230,y:Math.cos(a)*r*1.4,z:Math.sin(a)*r,ph:rnd()})}});
const edges=[];for(const a of nodes)for(const b of nodes)if(b.li==a.li+1&&rnd()<.4)edges.push({a,b,w:rnd(),ph:rnd(),k:1+Math.floor(rnd()*3)});
const pulses=edges.filter(()=>rnd()<.18);

function proj(x,y,z,rot,tilt,cz,cy=.42){
  const cr=Math.cos(rot),sr=Math.sin(rot);let X=x*cr-z*sr,Z=x*sr+z*cr;
  const ct=Math.cos(tilt),st=Math.sin(tilt);let Y=y*ct-Z*st;Z=y*st+Z*ct;
  const f=1100/(Z+cz);return{x:W/2+X*f,y:H*cy+Y*f,f,z:Z};
}
const lerp=(a,b,t)=>a+(b-a)*t;
function col(t,a){ // cyan -> magenta
  return `rgba(${lerp(0,255,t)|0},${lerp(240,46,t)|0},${lerp(255,151,t)|0},${a})`;}

function render(t){
  const p=t/T; // 0..1 loop phase
  g.globalCompositeOperation='source-over';
  g.fillStyle='#04040A';g.fillRect(0,0,W,H);
  // nebula glow
  const pulse=.5+.5*Math.sin(p*TAU*2);
  let rg=g.createRadialGradient(W/2,H*.42,0,W/2,H*.42,900);
  rg.addColorStop(0,`rgba(0,140,255,${.22+.08*pulse})`);rg.addColorStop(.5,'rgba(120,0,160,.10)');rg.addColorStop(1,'rgba(0,0,0,0)');
  g.fillStyle=rg;g.fillRect(0,0,W,H);
  g.globalCompositeOperation='lighter';

  // stars flying toward camera
  for(const s of stars){let z=((s.z-p*2)%1+1)%1;const f=1/(z*3+.05);
    const x=W/2+s.x*f*.12,y=H/2+s.y*f*.12;if(x<0||x>W||y<0||y>H)continue;
    const a=Math.min(1,(1-z)*1.2)*.8;g.fillStyle=col(s.s,a);g.beginPath();g.arc(x,y,(1-z)*2.6+.3,0,TAU);g.fill();}

  // loss landscape wireframe
  const N=44,S=110,rot2=p*TAU*.0;
  const hgt=(i,j)=>{const u=i/N*TAU,v=j/N*TAU;
    return 140*Math.sin(u*2+p*TAU)*Math.cos(v*2-p*TAU)+70*Math.sin(u*3-v+p*TAU*2)-120*Math.exp(-((i-N/2)**2+(j-N/2)**2)/60)};
  const pts=[];for(let i=0;i<=N;i++){pts[i]=[];for(let j=0;j<=N;j++){
    pts[i][j]=proj((i-N/2)*S,-hgt(i,j)*1.3,(j-N/2)*S,p*TAU/4*0+.3*Math.sin(p*TAU),.5,3400,.80);}}
  g.lineWidth=1.4;
  for(let i=0;i<=N;i++)for(let j=0;j<N;j++){const a=pts[i][j],b=pts[i][j+1];
    const fade=Math.max(0,Math.min(1,(a.y-H*.55)/350));
    g.strokeStyle=col(i/N,.55*fade);g.beginPath();g.moveTo(a.x,a.y);g.lineTo(b.x,b.y);g.stroke();
    const d=pts[j][i],e=pts[j+1][i];g.strokeStyle=col(j/N,.55*fade);g.beginPath();g.moveTo(d.x,d.y);g.lineTo(e.x,e.y);g.stroke();}
  // gradient-descent orb tracing a loop over landscape
  const oi=N/2+12*Math.cos(p*TAU),oj=N/2+12*Math.sin(p*TAU*2)*.8;
  const op=proj((oi-N/2)*S,-hgt(Math.round(oi),Math.round(oj))*1.3-40,(oj-N/2)*S,.3*Math.sin(p*TAU),.5,3400,.80);
  let og=g.createRadialGradient(op.x,op.y,0,op.x,op.y,90);og.addColorStop(0,'rgba(255,255,255,.95)');og.addColorStop(.15,'rgba(57,255,20,.7)');og.addColorStop(1,'rgba(0,0,0,0)');
  g.fillStyle=og;g.beginPath();g.arc(op.x,op.y,90,0,TAU);g.fill();

  // neural network
  const rot=p*TAU,tilt=.25*Math.sin(p*TAU),cz=1500+120*Math.sin(p*TAU*2);
  const P=new Map();for(const n of nodes)P.set(n,proj(n.x,n.y,n.z,rot,tilt,cz));
  g.lineWidth=1;
  for(const e of edges){const a=P.get(e.a),b=P.get(e.b);
    const act=.5+.5*Math.sin(p*TAU*e.k+e.ph*TAU);
    g.strokeStyle=col(e.a.li/4,.05+.18*act*e.w);g.beginPath();g.moveTo(a.x,a.y);g.lineTo(b.x,b.y);g.stroke();}
  // signal pulses
  for(const e of pulses){const a=P.get(e.a),b=P.get(e.b);
    for(let k=0;k<2;k++){const q=((p*e.k*2+e.ph+k*.5)%1);
      const x=lerp(a.x,b.x,q),y=lerp(a.y,b.y,q),r=4*lerp(a.f,b.f,q);
      // trail
      const q2=Math.max(0,q-.12);g.strokeStyle=col(e.b.li/4,.7);g.lineWidth=2.5*lerp(a.f,b.f,q);
      g.beginPath();g.moveTo(lerp(a.x,b.x,q2),lerp(a.y,b.y,q2));g.lineTo(x,y);g.stroke();
      g.fillStyle='rgba(255,255,255,.9)';g.beginPath();g.arc(x,y,r,0,TAU);g.fill();}}
  // nodes
  for(const n of nodes){const q=P.get(n);const fire=Math.pow(.5+.5*Math.sin(p*TAU*3+n.ph*TAU+n.li*1.3),6);
    const R=(14+26*fire)*q.f;
    let ng=g.createRadialGradient(q.x,q.y,0,q.x,q.y,R*3);
    ng.addColorStop(0,'rgba(255,255,255,'+(.6+.4*fire)+')');ng.addColorStop(.25,col(n.li/4,.6));ng.addColorStop(1,'rgba(0,0,0,0)');
    g.fillStyle=ng;g.beginPath();g.arc(q.x,q.y,R*3,0,TAU);g.fill();}

  // scanline sweep + vignette
  const sy=(p*2%1)*H;let sg=g.createLinearGradient(0,sy-120,0,sy+120);
  sg.addColorStop(0,'rgba(0,240,255,0)');sg.addColorStop(.5,'rgba(0,240,255,.07)');sg.addColorStop(1,'rgba(0,240,255,0)');
  g.fillStyle=sg;g.fillRect(0,sy-120,W,240);
  g.globalCompositeOperation='source-over';
  let vg=g.createRadialGradient(W/2,H/2,H*.3,W/2,H/2,H*.75);vg.addColorStop(0,'rgba(0,0,0,0)');vg.addColorStop(1,'rgba(0,0,0,.85)');
  g.fillStyle=vg;g.fillRect(0,0,W,H);
}
window.render=render;render(0);
</script></body></html>
